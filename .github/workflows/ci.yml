name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio coverage black mypy
        if [ -f agent_cloud/requirements.txt ]; then pip install -r agent_cloud/requirements.txt; fi
        
    - name: Code Quality - Black
      run: black --check agent_cloud mcp_server ros_workspace
      
    - name: Type Checking - MyPy
      run: mypy agent_cloud mcp_server
      
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run Unit Tests with Coverage
      run: |
        pytest --cov=agent_cloud --cov=mcp_server tests/unit/
        
  build-firmware:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install ARM GCC
      run: sudo apt-get install gcc-arm-none-eabi make
    - name: Compile STM32 Firmware
      run: |
        cd stm32_firmware
        make -j4
