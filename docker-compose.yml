version: '3.8'

services:
  agent-cloud:
    build: 
      context: ./agent_cloud
      dockerfile: Dockerfile
    image: embodied-agent-cloud:latest
    environment:
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_DB_URL=http://weaviate:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
      - weaviate
      - mcp-server
    restart: always

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    image: embodied-mcp-server:latest
    ports:
      - "5000:5000"
    environment:
      - ROS_GATEWAY_URL=http://ros-gateway:8000
    depends_on:
      - ros-gateway

  ros-gateway:
    build:
      context: ./ros_workspace
      dockerfile: Dockerfile
    image: embodied-ros-gateway:latest
    network_mode: host # Requires host network for DDS discovery
    ports:
      - "8000:8000"

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  weaviate:
    image: semitechnologies/weaviate:1.24.4
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-openai'

volumes:
  redis_data:
  weaviate_data:
